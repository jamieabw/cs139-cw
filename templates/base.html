<!DOCTYPE html>
<html>
    <head lang="en">
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="{{ url_for('static', filename='css/bootstrap.min.css') }}">
        <link rel="stylesheet" href="{{url_for('static', filename='css/customBase.css')}}">
        <!--<link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">-->
        {% block head %}
        {% endblock %}
    </head>
    <body class="container">
        <nav class="nav">
            <a href="{{url_for('root.index')}}">
            <h1>Digital Bill Splitter Deluxe</h1>
            </a>
            <button class="btn dropdown-toggle" type="button" data-bs-toggle="dropdown">Add Group</button>
            <ul class="dropdown-menu">
                <li><button type="button" data-bs-toggle="modal" data-bs-target="#createGroupModal">Create group</button></li>
                <li><button type="button" data-bs-toggle="modal" data-bs-target="#joinGroupModal">Join group</button></li>
            </ul>
            <button class="btn"><a href="{{url_for('account.debts')}}" >View debts</a></button>
            <button class="btn dropdown-toggle" type="button" data-bs-toggle="dropdown">Account</button>
            <ul class="dropdown-menu">
                <li><a class="dropdown-item" href="{{url_for('account.manage')}}">Account settings</a></li>
                <li><a class="dropdown-item" href="{{url_for('account.logout')}}">Log out</a></li>
            </ul>
        </nav>
        {% block content %}
        {% endblock %}
        <div class="modal fade" id="createGroupModal" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">

                <div class="modal-header">
                    <h5 class="modal-title">Create group</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>

                <div class="modal-body">
                    <form method="POST">
                    <a href="{{url_for('root.createGroup')}}">Create group</a>
                    </form>
                </div>

                </div>
            </div>
        </div>
        <div class="modal fade" id="joinGroupModal" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">

                <div class="modal-header">
                    <h5 class="modal-title">Create group</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>

                <div class="modal-body">
                    <a href="{{url_for('root.joinGroup')}}">Join group</a>
                </div>

                </div>
            </div>
        </div>
        <script src="{{ url_for('static', filename='js/bootstrap.bundle.min.js') }}"></script>
    </body>
</html>
