{% extends "base.html" %}
{% block head %}
{% endblock %}
{% block content %}
<h2>Groups</h2>
{% if groups|length == 0 %}
    <p>Sorry, there are no groups to display.</p>
{% else %}
    <div class="grid">
    {% for group in groups %}
        <div class="row">
            <a href="{{url_for('group.groupPage', id=group.id)}}">
            <div class="col">{{group.name}}</div>
            <div class="col">{{group.groupId}}</div>
            <div class="col">{{group.createdAt}}</div>
            </a>
        </div>

    {% endfor %}
    </div>
{% endif %}

{% endblock %}
