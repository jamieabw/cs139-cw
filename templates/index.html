{% extends "base.html" %}
{% block head %}
{% endblock %}
{% block content %}
<h2>Groups</h2>
<div class="grid groupGrid">
{% if groups|length == 0 %}
    <p>Sorry, there are no groups to display.</p>
{% else %}
    {% for group in groups %}
        <div class="row groupContainer">
            <a href="{{url_for('group.groupPage', id=group.id)}}">
            <div class="col">{{group.name}}</div>
            <div class="col">{{group.groupId}}</div>
            <div class="col">{{group.createdAt}}</div>
            </a>
        </div>

    {% endfor %}
{% endif %}
</div>

{% endblock %}
