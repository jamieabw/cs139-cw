{% extends "base.html" %}
{% block head %}
{% endblock %}
{% block content %}
<h2>Groups</h2>
{% if groups|length == 0 %}
    <p>Sorry, there are no groups to display.</p>
{% else %}
    <div class="container flex">
    {% for group in groups %}
        <div class="d-inline col-md border 3-p groupContainer">
            <a href="{{url_for('group.groupPage', id=group.id)}}"><p class="text-center">{{group.name}}</p></a>
        </div>

    {% endfor %}
    </div>
{% endif %}

{% endblock %}
